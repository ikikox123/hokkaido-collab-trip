<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffcf5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script>
      (function () {
        var t = 'a';
        try {
          var v = localStorage.getItem('hokkaido-theme');
          if (v === 'b' || v === 'c') t = v;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
        var colors = { a: '#fffcf5', b: '#fcfcfa', c: '#0b1030' };
        document.querySelector('meta[name="theme-color"]').setAttribute('content', colors[t]);
      })();
    </script>
    <title>瘋瘋火火北海道冒險記</title>
  </head>
  <body class="bg-snow-50 text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
